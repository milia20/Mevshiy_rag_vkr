[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mkdocs-rag-plugin"
version = "0.1.0"
description = "MkDocs плагин для RAG-поиска с использованием Qdrant и LLM для русскоязычной документации"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "your.email@example.com" }
]
keywords = ["mkdocs", "search", "rag", "qdrant", "llm", "plugin", "documentation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Documentation",
]
requires-python = ">=3.13"

dependencies = [
    "mkdocs>=1.4.0",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.0.0",
    "qdrant-client>=1.7.0",
    "sentence-transformers>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "black>=24.0.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
]

[project.entry-points."mkdocs.plugins"]
rag_plugin = "mkdocs_plugin.plugin:RAGPlugin"

[project.urls]
Homepage = "https://github.com/your-username/mkdocs-rag-plugin"
Documentation = "https://your-username.github.io/mkdocs-rag-plugin"
Repository = "https://github.com/your-username/mkdocs-rag-plugin"

[tool.hatch.build.targets.wheel]
packages = ["mkdocs_plugin", "src"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"
select = ["E", "F", "W", "I", "N", "B", "UP", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
