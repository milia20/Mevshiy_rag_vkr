services:
  # FastAPI приложение
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - RAG_QDRANT_URL=http://qdrant:6333
      - RAG_QDRANT_COLLECTION=docs_index
      - RAG_EMBEDDING_MODEL=sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2
      - RAG_LLM_PROVIDER=ollama
      - RAG_LLM_MODEL=qwen2.5:7b
      - RAG_LLM_BASE_URL=http://ollama:11434
      - RAG_DEBUG=true
    depends_on:
      qdrant:
        condition: service_healthy
    volumes:
      - ../mkdocs_plugin:/app/mkdocs_plugin
      - ../src:/app/src
    networks:
      - rag-network
    restart: unless-stopped

  # Qdrant векторная база данных
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:6333/" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - rag-network
    restart: unless-stopped

  # Ollama для LLM (опционально)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    # Раскомментируйте для использования GPU
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    networks:
      - rag-network
    restart: unless-stopped
    # Автозагрузка модели при старте
    command: >
      sh -c "ollama serve &
      sleep 5 &&
      ollama pull qwen2.5:7b &&
      wait"

networks:
  rag-network:
    driver: bridge

volumes:
  qdrant_storage:
    driver: local
  ollama_storage:
    driver: local
