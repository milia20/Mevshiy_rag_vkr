{% extends 'base.html' %}

{% block footer %}
{{ super() }}

<!-- AI Chat Widget Styles -->
<style>
    /* Chat Button */
    .chat-toggle-btn {
        position: fixed;
        bottom: 30px;
        right: 30px;
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background: linear-gradient(135deg, #2563eb, #3b82f6);
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 8px 32px rgba(37, 99, 235, 0.4);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        z-index: 1000;
        padding: 0;
    }

    .chat-toggle-btn:hover {
        transform: scale(1.1);
        box-shadow: 0 12px 40px rgba(37, 99, 235, 0.6);
    }

    .chat-toggle-btn:active {
        transform: scale(0.95);
    }

    .chat-toggle-btn svg {
        width: 28px;
        height: 28px;
        fill: white;
        transition: transform 0.3s ease;
    }

    .chat-toggle-btn.is-open svg.icon-chat {
        display: none;
    }

    .chat-toggle-btn:not(.is-open) svg.icon-close {
        display: none;
    }

    /* Chat Panel */
    .chat-panel {
        position: fixed;
        bottom: 110px;
        right: 30px;
        width: 420px;
        max-width: calc(100vw - 40px);
        height: 600px;
        max-height: calc(100vh - 150px);
        background: #112240;
        border-radius: 20px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        z-index: 999;
        opacity: 0;
        transform: translateY(20px) scale(0.95);
        pointer-events: none;
        transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
    }

    .chat-panel.open {
        opacity: 1;
        transform: translateY(0) scale(1);
        pointer-events: all;
    }

    /* Chat Header */
    .chat-header {
        padding: 20px 24px;
        background: linear-gradient(135deg, #1e40af, #3b82f6);
        display: flex;
        align-items: center;
        gap: 14px;
    }

    .chat-avatar {
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.2);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
    }

    .chat-avatar svg {
        width: 22px;
        height: 22px;
        fill: white;
    }

    .chat-header-info h3 {
        font-size: 1rem;
        font-weight: 700;
        color: white;
    }

    /* Chat Messages */
    .chat-messages {
        flex: 1;
        overflow-y: auto;
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        scroll-behavior: smooth;
    }

    .chat-messages::-webkit-scrollbar {
        width: 5px;
    }

    .chat-messages::-webkit-scrollbar-track {
        background: transparent;
    }

    .chat-messages::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
    }

    .message {
        display: flex;
        gap: 10px;
        max-width: 90%;
        animation: messageIn 0.3s ease;
    }

    @keyframes messageIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .message.user {
        align-self: flex-end;
        flex-direction: row-reverse;
    }

    .message.bot {
        align-self: flex-start;
    }

    .message-avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        flex-shrink: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.8rem;
        font-weight: 700;
    }

    .message.bot .message-avatar {
        background: linear-gradient(135deg, #2563eb, #3b82f6);
        color: white;
    }

    .message.user .message-avatar {
        background: rgba(255, 255, 255, 0.15);
        color: #9ca3af;
    }

    .message-bubble {
        padding: 12px 16px;
        border-radius: 16px;
        font-size: 0.9rem;
        line-height: 1.5;
        word-break: break-word;
    }

    .message.bot .message-bubble {
        background: rgba(255, 255, 255, 0.06);
        color: rgba(255, 255, 255, 0.9);
        border-bottom-left-radius: 4px;
    }

    .message.user .message-bubble {
        background: linear-gradient(135deg, #2563eb, #3b82f6);
        color: white;
        border-bottom-right-radius: 4px;
    }

    /* Typing Indicator */
    .typing-indicator {
        display: flex;
        gap: 5px;
        padding: 14px 20px;
        align-items: center;
    }

    .typing-indicator span {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.4);
        animation: typingBounce 1.4s infinite;
    }

    .typing-indicator span:nth-child(2) {
        animation-delay: 0.2s;
    }

    .typing-indicator span:nth-child(3) {
        animation-delay: 0.4s;
    }

    @keyframes typingBounce {
        0%, 60%, 100% {
            transform: translateY(0);
            background: rgba(255, 255, 255, 0.4);
        }
        30% {
            transform: translateY(-8px);
            background: rgba(255, 255, 255, 0.8);
        }
    }

    .typing-cursor {
        display: inline-block;
        width: 2px;
        height: 1em;
        background: #3b82f6;
        margin-left: 2px;
        animation: blink 0.7s infinite;
        vertical-align: text-bottom;
    }

    @keyframes blink {
        0%, 100% {
            opacity: 1;
        }
        50% {
            opacity: 0;
        }
    }

    /* Links Section */
    .message-links {
        display: flex;
        flex-direction: column;
        gap: 6px;
        margin-top: 10px;
    }

    .message-link {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        background: rgba(59, 130, 246, 0.1);
        border: 1px solid rgba(59, 130, 246, 0.2);
        border-radius: 10px;
        color: #93c5fd;
        font-size: 0.82rem;
        text-decoration: none;
        transition: all 0.2s ease;
        cursor: pointer;
    }

    .message-link:hover {
        background: rgba(59, 130, 246, 0.2);
        border-color: rgba(59, 130, 246, 0.35);
        color: #bfdbfe;
        transform: translateX(4px);
    }

    .message-link svg {
        width: 16px;
        height: 16px;
        fill: #3b82f6;
        flex-shrink: 0;
    }

    /* Chat Input */
    .chat-input-area {
        padding: 16px 20px;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        display: flex;
        gap: 10px;
        align-items: center;
        background: rgba(0, 0, 0, 0.2);
    }

    .chat-input-area input {
        flex: 1;
        background: rgba(255, 255, 255, 0.06);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 14px;
        padding: 12px 18px;
        color: white;
        font-size: 0.9rem;
        outline: none;
        transition: all 0.2s ease;
    }

    .chat-input-area input::placeholder {
        color: rgba(255, 255, 255, 0.3);
    }

    .chat-input-area input:focus {
        border-color: rgba(59, 130, 246, 0.5);
        background: rgba(255, 255, 255, 0.08);
    }

    .send-btn {
        width: 44px;
        height: 44px;
        border-radius: 14px;
        background: linear-gradient(135deg, #2563eb, #3b82f6);
        border: none;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.2s ease;
        flex-shrink: 0;
    }

    .send-btn:hover {
        transform: scale(1.05);
        box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
    }

    .send-btn:active {
        transform: scale(0.95);
    }

    .send-btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
        transform: none;
    }

    .send-btn svg {
        width: 20px;
        height: 20px;
        fill: white;
    }

    /* Welcome message */
    .welcome-msg {
        text-align: center;
        padding: 30px 20px;
        color: rgba(255, 255, 255, 0.3);
        font-size: 0.85rem;
        line-height: 1.5;
    }

    .welcome-msg .welcome-icon {
        font-size: 2rem;
        margin-bottom: 10px;
    }

    /* MkDocs integration: adjust for mobile and header */
    @media (max-width: 76.1875em) {
        .chat-panel {
            bottom: 0;
            right: 0;
            width: 100%;
            max-width: 100%;
            height: 100vh;
            max-height: 100vh;
            border-radius: 0;
        }

        .chat-toggle-btn {
            bottom: 20px;
            right: 20px;
        }
    }

    /* Hide old iframe-based bot */
    .bot-container {
        display: none !important;
    }
</style>

<!-- Chat Toggle Button -->
<button class="chat-toggle-btn" id="chatToggleBtn" aria-label="Открыть чат">
    <svg class="icon-chat" viewBox="0 0 24 24">
        <path d="M20 2H4c-1.1 0-2 .9-2 2v18l4-4h14c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H5.17L4 17.17V4h16v12z"/>
        <path d="M7 9h2v2H7zm4 0h2v2h-2zm4 0h2v2h-2z"/>
    </svg>
    <svg class="icon-close" viewBox="0 0 24 24">
        <path
            d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
    </svg>
</button>

<!-- Chat Panel -->
<div class="chat-panel" id="chatPanel">
    <div class="chat-header">
        <div class="chat-avatar">
            <svg viewBox="0 0 24 24">
                <path
                    d="M12 2a2 2 0 012 2c0 .74-.4 1.39-1 1.73V7h1a7 7 0 017 7h1a1 1 0 011 1v3a1 1 0 01-1 1h-1.27A7 7 0 0113 21h-2a7 7 0 01-6.73-2H3a1 1 0 01-1-1v-3a1 1 0 011-1h1a7 7 0 017-7h1V5.73c-.6-.34-1-.99-1-1.73a2 2 0 012-2zm-2 13a1.5 1.5 0 100 3 1.5 1.5 0 000-3zm4 0a1.5 1.5 0 100 3 1.5 1.5 0 000-3z"/>
            </svg>
        </div>
        <div class="chat-header-info">
            <h3>AI Ассистент</h3>
        </div>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="welcome-msg">
            <div class="welcome-icon">👋</div>
            <div>Привет! Я ваш ИИ-ассистент по документации.<br>Задайте мне любой вопрос.</div>
        </div>
    </div>

    <div class="chat-input-area">
        <input type="text" id="chatInput" placeholder="Введите сообщение..." autocomplete="off">
        <button class="send-btn" id="sendBtn" aria-label="Отправить">
            <svg viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
            </svg>
        </button>
    </div>
</div>

<script>
    // ===== MkDocs Integration: Project Context =====
    const isLocalHost = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const projectName = isLocalHost ? 'default' : (pathParts[0] || 'default');
    const currentPage = window.location.pathname + window.location.hash;

    // ===== Configuration =====
    const CHAT_API_URL = "{{ chatbot_url }}";
    const TYPING_DELAY_MIN = 30;
    const TYPING_DELAY_MAX = 80;
    const THINKING_TIME = 2000;

    // ===== DOM Elements =====
    const chatToggleBtn = document.getElementById('chatToggleBtn');
    const chatPanel = document.getElementById('chatPanel');
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');
    const sendBtn = document.getElementById('sendBtn');

    let isOpen = false;
    let isWaiting = false;

    // ===== Chat Logic =====

    function toggleChat() {
        isOpen = !isOpen;
        chatPanel.classList.toggle('open', isOpen);
        chatToggleBtn.classList.toggle('is-open', isOpen);

        if (isOpen) {
            setTimeout(() => chatInput.focus(), 400);
            // Prevent clicks inside chat from closing it
            chatPanel.addEventListener('click', (e) => e.stopPropagation(), {passive: true});
        }
    }

    function createMessageEl(type, text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${type}`;

        const avatar = document.createElement('div');
        avatar.className = 'message-avatar';
        avatar.textContent = type === 'user' ? 'U' : 'AI';

        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        bubble.innerHTML = escapeHtml(text).replace(/\n/g, '<br>');

        msgDiv.appendChild(avatar);
        msgDiv.appendChild(bubble);
        return msgDiv;
    }

    function addTypingIndicator() {
        const msgDiv = document.createElement('div');
        msgDiv.className = 'message bot';
        msgDiv.id = 'typingMsg';

        const avatar = document.createElement('div');
        avatar.className = 'message-avatar';
        avatar.textContent = 'AI';

        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        bubble.innerHTML = '<div class="typing-indicator"><span></span><span></span><span></span></div>';

        msgDiv.appendChild(avatar);
        msgDiv.appendChild(bubble);
        chatMessages.appendChild(msgDiv);
        scrollToBottom();
    }

    function removeTypingIndicator() {
        const el = document.getElementById('typingMsg');
        if (el) el.remove();
    }

    function scrollToBottom() {
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    async function typeWriter(bubbleEl, text) {
        let i = 0;
        const cursor = document.createElement('span');
        cursor.className = 'typing-cursor';
        bubbleEl.textContent = '';
        bubbleEl.appendChild(cursor);

        return new Promise((resolve) => {
            function typeChar() {
                if (i < text.length) {
                    const before = text.substring(0, i + 1);
                    bubbleEl.textContent = before;
                    bubbleEl.appendChild(cursor);
                    i++;
                    const delay = TYPING_DELAY_MIN + Math.random() * (TYPING_DELAY_MAX - TYPING_DELAY_MIN);
                    scrollToBottom();
                    setTimeout(typeChar, delay);
                } else {
                    setTimeout(() => {
                        cursor.remove();
                        resolve();
                    }, 800);
                }
            }

            typeChar();
        });
    }

    function addLinks(bubbleEl, links) {
        if (!links || links.length === 0) return;

        const linksContainer = document.createElement('div');
        linksContainer.className = 'message-links';

        links.forEach((link) => {
            const a = document.createElement('a');
            a.className = 'message-link';
            a.href = link.url || '#';
            a.target = '_blank';
            a.rel = 'noopener noreferrer';

            const svgIcon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
            svgIcon.setAttribute('viewBox', '0 0 24 24');
            const pathEl = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            pathEl.setAttribute('d', 'M14 2H6c-1.1 0-2 .9-2 2v16c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V8l-6-6zm-1 7V3.5L18.5 9H13zM6 20V4h5v7h7v9H6z');
            svgIcon.appendChild(pathEl);

            const textSpan = document.createElement('span');
            textSpan.textContent = link.label;

            a.appendChild(svgIcon);
            a.appendChild(textSpan);
            linksContainer.appendChild(a);
        });

        bubbleEl.appendChild(linksContainer);
    }

    async function handleUserMessage(text) {
        if (!text.trim() || isWaiting) return;
        isWaiting = true;
        sendBtn.disabled = true;

        // Remove welcome message if present
        const welcome = chatMessages.querySelector('.welcome-msg');
        if (welcome) welcome.remove();

        // Add user message
        chatMessages.appendChild(createMessageEl('user', text));
        scrollToBottom();

        chatInput.value = '';

        // Show typing indicator
        addTypingIndicator();

        try {
            // Call FastAPI server via HTTP
            const response = await fetch(`${CHAT_API_URL}/chat`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({
                    query: text,
                    project: projectName,
                    page: currentPage,
                }),
            });

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();

            removeTypingIndicator();

            // Create bot message with response
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message bot';

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = 'AI';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';

            msgDiv.appendChild(avatar);
            msgDiv.appendChild(bubble);
            chatMessages.appendChild(msgDiv);

            // Type out the response
            await typeWriter(bubble, data.response || 'Извините, произошла ошибка при обработке запроса.');

            // Add links if provided
            if (data.sources && data.sources.length > 0) {
                const links = data.sources.map(source => ({
                    url: source.url || source.source_file,
                    label: source.title || source.source_file
                }));
                addLinks(bubble, links);
            }

            scrollToBottom();

        } catch (error) {
            console.error('Error calling chat API:', error);
            removeTypingIndicator();

            // Show error message
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message bot';

            const avatar = document.createElement('div');
            avatar.className = 'message-avatar';
            avatar.textContent = 'AI';

            const bubble = document.createElement('div');
            bubble.className = 'message-bubble';
            bubble.textContent = 'Извините, не удалось подключиться к серверу. Пожалуйста, убедитесь, что сервер запущен.';

            msgDiv.appendChild(avatar);
            msgDiv.appendChild(bubble);
            chatMessages.appendChild(msgDiv);
            scrollToBottom();
        }

        isWaiting = false;
        sendBtn.disabled = false;
        chatInput.focus();
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    function sleep(ms) {
        return new Promise(r => setTimeout(r, ms));
    }

    // ===== Event Listeners =====
    chatToggleBtn.addEventListener('click', (e) => {
        toggleChat();
        e.stopPropagation();
    });

    sendBtn.addEventListener('click', () => {
        handleUserMessage(chatInput.value);
    });

    chatInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleUserMessage(chatInput.value);
        }
    });

    // Close chat on Escape or clicking outside
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && isOpen) {
            toggleChat();
        }
    });

    document.addEventListener('click', (e) => {
        if (isOpen && !chatPanel.contains(e.target) && !chatToggleBtn.contains(e.target)) {
            toggleChat();
        }
    });

    // Handle MkDocs navigation (SPA-like behavior)
    if (document$.subscribe) {
        document$.subscribe(() => {
            // Update current page context on navigation
            currentPage = window.location.pathname + window.location.hash;
        });
    }
</script>
{% endblock %}
